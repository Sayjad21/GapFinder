# Devset case: G-Mixup (Han et al., ICML 2022), Table 2, GIN rows on IMDB-B and IMDB-M (see HARNESS.md: the
# released code has no GCN model, so the assigned GCN target can't run; GIN is the backbone the code ships).
# Target: GIN w/ G-Mixup on IMDB-B (71.94). Held-out: GIN vanilla IMDB-B, GIN w/ G-Mixup and vanilla IMDB-M.
#
# Knobs: every argparse flag of src/gmixup.py that the code reads to train or evaluate, at the run scripts'
# values (run_vanilla.sh / run_gmixup.sh pass --lr 0.01 --batch_size 128 --num_hidden 64 --aug_ratio 0.15
# --aug_num 10; --epoch and --lam_range are code defaults). --lam_range is one flag holding two numbers, so it
# is two numeric knobs, lam_lo and lam_hi. Left out: --data_path, --log_screen (how to run), --seed (from
# RUN_TAG), --dataset, --model, --gmixup (which row a metric belongs to), --ge and --gnn (never read: ge is
# only logged, the estimator is always universal_svd; gnn is unused).
# One cell = 1 seed x 4 rows (4 processes, 1 thread each): about 6.5 min on an idle VM, about 25 min under the
# batch's load (run0-aborted: a VM gave about 1 CPU), about 0.5 GB per process.
name: gmixup
base: ${GF_DEV_BASE}
source: ${GF_DEV_SOURCE}
run:
  command: 'export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1; mkdir -p out; S=$(( $(printf %s "$RUN_TAG" | cksum | cut -d" " -f1) % 100000 )); A="--lr {lr} --batch_size {batch_size} --num_hidden {num_hidden} --epoch {epoch} --aug_ratio {aug_ratio} --aug_num {aug_num} --ge USVT"; for k in 0; do s=$((S + 10000*k)); for ds in IMDB-BINARY IMDB-MULTI; do for gm in False True; do PYTHONPATH="/work/src${PYTHONPATH:+:$PYTHONPATH}" python -u ./src/gmixup.py --data_path . --model GIN --dataset $ds --gmixup $gm --seed $s --log_screen True --lam_range "[{lam_lo},{lam_hi}]" $A > out/${ds}_${gm}_$k.log 2>&1 & done; done; wait; done; bash gf_harness/emit.sh'
  output: stdout
  format: kv
  timeout: 3500
knobs:
  epoch:      {layer: config, default: "800", max: 1600}
  batch_size: {layer: config, default: "128"}
  lr:         {layer: config, default: "0.01"}
  num_hidden: {layer: config, default: "64", max: 256}
  lam_lo:     {layer: config, default: "0.005"}
  lam_hi:     {layer: config, default: "0.01"}
  aug_ratio:  {layer: config, default: "0.15"}
  aug_num:    {layer: config, default: "10"}
allowed_paths: ["out/"]
metrics: [gin_imdbb_gmixup_acc, gin_imdbb_vanilla_acc, gin_imdbm_gmixup_acc, gin_imdbm_vanilla_acc]
