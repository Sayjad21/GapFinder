name: web
# The site's checks: types, component and accessibility tests, a production build, then Lighthouse on the static
# build with its exported data. Runs when the site or its data export changes.
on:
  push:
    paths: ["web/**", "scripts/export_static.py", "scripts/build_showcase.py", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "scripts/export_static.py", "scripts/build_showcase.py", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv && uv pip install --python .venv -e .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: cd web && VITE_STATIC=1 npx vite build --outDir dist-static
      - run: .venv/bin/python scripts/export_static.py web/dist-static/data --showcase
      - run: cd web && node scripts/lighthouse.mjs dist-static lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse
