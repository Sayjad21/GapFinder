name: ncf
base: 86fb8606-fb43-451a-9e95-99b4ca256af0
source: <scratch>/db2/ncf/repo
run:
  command: export KERAS_BACKEND=theano OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1; mkdir -p out; python -c "import keras" > /dev/null 2>&1; C="--dataset ml-1m --out 0 --epochs {epochs} --batch_size {batch_size} --num_neg {num_neg} --lr {lr} --learner {learner} --verbose {verbose}"; P=""; if [ -n "{mf_pretrain}" ]; then P="$P --mf_pretrain {mf_pretrain}"; fi; if [ -n "{mlp_pretrain}" ]; then P="$P --mlp_pretrain
    {mlp_pretrain}"; fi; s=$(date +%s); python NeuMF.py $C --num_factors {num_factors} --layers "[{layers}]" --reg_mf {reg_mf} --reg_layers "[{reg_layers}]" $P > out/neumf.log 2>&1 & python GMF.py $C --num_factors {num_factors} --regs "[{regs}]" > out/gmf.log 2>&1 & python MLP.py $C --layers "[{layers}]" --reg_layers "[{reg_layers}]" > out/mlp.log 2>&1 & wait; echo wall_s=$(( $(date +%s) - s )); bash
    gf_harness/emit.sh
  output: stdout
  format: kv
  timeout: 3500
knobs:
  epochs:
    layer: workload
    default: '20'
    max: 70
  batch_size:
    layer: workload
    default: '256'
  num_neg:
    layer: workload
    default: '4'
    max: 8
  lr:
    layer: config
    default: '0.001'
  learner:
    layer: config
    default: adam
    choices:
    - adagrad
    - adam
    - rmsprop
    - sgd
  verbose:
    layer: workload
    default: '1'
  num_factors:
    layer: config
    default: '8'
  layers:
    layer: config
    default: 64,32,16,8
  reg_mf:
    layer: config
    default: '0'
  reg_layers:
    layer: config
    default: 0,0,0,0
  regs:
    layer: config
    default: 0,0
  mf_pretrain:
    layer: config
    default: ''
  mlp_pretrain:
    layer: config
    default: ''
allowed_paths:
- out/
metrics:
- neumf_hr
- neumf_ndcg
- gmf_hr
- gmf_ndcg
- mlp_hr
- mlp_ndcg
- neumf_best_iter
- gmf_best_iter
