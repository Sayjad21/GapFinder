# Harness spec: RusKey Figure 6 (balanced panel, with write-heavy as the held-out panel).
#
# base: ubuntu:24.04 with the prebuilt driver bundle (driver/, lib/) and papers/ruskey/harness in /work. Spike S3 creates it and prints GF_RUSKEY_SOURCE=<uuid>; put that in .env.
# Defaults = the reproduction's own settings (its scripts pass --direct_io and
# --target_file_size_mb 2), EXCEPT num_keys: the reproduction used 20M-100M keys (20-100 GB),
# and sandbox CPU is billed per second (~0.01/CPU-s), so it is scaled to 500K here (the S3 checkpoint). The Gap Report must
# state this scaling.
name: ruskey-fig6
base: ${GF_RUSKEY_SOURCE}
build:
  # The driver is prebuilt locally (scripts/prep_ruskey_bin.sh) and uploaded by spike S3:
  # compiling RocksDB in a sandbox costs thousands of CPU-seconds. This stage only checks that
  # the binary's libraries resolve. Build options are therefore out of scope for RusKey.
  command: 'LD_LIBRARY_PATH=/work/lib ldd /work/driver/ruskey_bench | grep -q "not found" && exit 1; echo prebuilt-ok'
  timeout: 120
load:
  command: 'bash /work/harness/load.sh db=/work/db num_keys={num_keys} key_size={key_size} value_size={value_size} sequential_load={sequential_load} logical_levels={logical_levels} size_ratio={size_ratio} write_buffer={write_buffer} target_file_size_mb={target_file_size_mb} bits_per_key={bits_per_key} monkey={monkey} direct_io={direct_io} background_jobs={background_jobs} block_cache_mb={block_cache_mb}'
  timeout: 3600
run:
  command: 'bash /work/harness/fig6_cell.sh db=/work/db workloads=balanced:0.5,writeheavy:0.1 missions={missions} ops_per_mission={ops_per_mission} num_keys={num_keys} key_size={key_size} value_size={value_size} logical_levels={logical_levels} size_ratio={size_ratio} write_buffer={write_buffer} target_file_size_mb={target_file_size_mb} bits_per_key={bits_per_key} monkey={monkey} direct_io={direct_io} background_jobs={background_jobs} rate_limit_mb={rate_limit_mb} block_cache_mb={block_cache_mb} zero_result_ratio={zero_result_ratio}'
  output: out/result.json
  format: jsonl
  timeout: 3600
knobs:
  num_keys:            {layer: dataset, default: "500000", max: 2000000}
  key_size:            {layer: dataset, default: "128"}
  value_size:          {layer: dataset, default: "896"}
  sequential_load:     {layer: dataset, default: "false"}
  logical_levels:      {layer: dataset, default: "6"}
  size_ratio:          {layer: dataset, default: "10"}
  write_buffer:        {layer: dataset, default: "2097152"}
  target_file_size_mb: {layer: dataset, default: "2"}
  bits_per_key:        {layer: dataset, default: "8"}
  monkey:              {layer: dataset, default: "false"}
  direct_io:           {layer: config, default: "true"}
  background_jobs:     {layer: config, default: "4"}
  rate_limit_mb:       {layer: environment, default: "0"}
  block_cache_mb:      {layer: config, default: "32"}
  zero_result_ratio:   {layer: workload, default: "0.0"}
  missions:            {layer: workload, default: "10", max: 20}
  ops_per_mission:     {layer: workload, default: "10000", max: 20000}
allowed_paths: ["out/", "configs/"]
metrics: [balanced_ratio_k1_k5, balanced_ratio_k10_k5, balanced_ratio_k1_k10, writeheavy_ratio_k1_k10,
          writeheavy_ratio_k10_k5, balanced_wamp_k1, balanced_wamp_k10, balanced_us_k5]
