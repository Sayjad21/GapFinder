# Toy for patch knobs in the entry script (tests/integration/test_patch_knobs.py).
name: patch-main-toy
base: local:patch_main
run:
  command: '"${PYTHON:-python3}" bench.py --alpha {alpha}'
  output: out/run.log
  format: kv
  timeout: 30
knobs:
  alpha: {layer: config, default: "1.0", candidates: ["2.0"]}
allowed_paths: ["out/"]
metrics: [score, aux]
