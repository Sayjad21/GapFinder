# Toy for patch knobs (tests/integration/test_patch_knobs.py): the cause is a literal in an imported module.
name: patch-toy
base: local:patch_knob
run:
  command: '"${PYTHON:-python3}" bench.py --alpha {alpha}'
  output: out/run.log
  format: kv
  timeout: 30
knobs:
  alpha: {layer: config, default: "1.0", candidates: ["2.0"]}
allowed_paths: ["out/"]
metrics: [score, aux]
