name: mcd
base: 76b71887-d3e7-48ff-96d5-f16cefcf6779
source: <scratch>/ext/mcd
build:
  command: sed -i 's/T = 10000/T = 100/' net/net.py && grep -q 'T = 100' net/net.py && echo patched-ok
  timeout: 120
run:
  command: export THEANO_FLAGS=device=cpu,floatX=float32 KERAS_BACKEND=theano OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1; bash run_cell.sh dir={dir} epochx={epochx} hidden={hidden} n_splits={n_splits} n_epochs={n_epochs} n_hidden={n_hidden} dropout_rates={dropout_rates} tau_values_yacht={tau_values_yacht} tau_values_energy={tau_values_energy} tau_values_concrete={tau_values_concrete}
    procs=auto
  output: stdout
  format: kv
  timeout: 3600
knobs:
  dir:
    layer: dataset
    default: energy,yacht
  epochx:
    layer: config
    default: '500'
  hidden:
    layer: config
    default: '2'
  n_epochs:
    layer: config
    default: default
  n_hidden:
    layer: config
    default: default
  dropout_rates:
    layer: config
    default: default
  tau_values_yacht:
    layer: config
    default: default
  tau_values_energy:
    layer: config
    default: default
  tau_values_concrete:
    layer: config
    default: default
  n_splits:
    layer: dataset
    default: '3'
    max: 20
allowed_paths:
- out/
- UCI_Datasets/*/data/n_epochs.txt
- UCI_Datasets/*/data/n_hidden.txt
- UCI_Datasets/*/data/dropout_rates.txt
- UCI_Datasets/*/data/tau_values.txt
- UCI_Datasets/*/data/n_splits.txt
- UCI_Datasets/*/results/
metrics:
- yacht_rmse
- energy_rmse
- concrete_rmse
- yacht_ll
- energy_ll
- concrete_ll
discrepancy: 0.05
